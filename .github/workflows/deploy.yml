name: Deploy to Railway

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:  # Allow manual deployment

env:
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}
    runs-on: ubuntu-latest
    
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://camppowerup-registration.up.railway.app' || 'https://camppowerup-staging.up.railway.app' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run pre-deployment tests
      run: |
        pip install pytest
        pytest tests/integration -v
    
    - name: Create database backup
      run: |
        python scripts/database/backup.py
      if: github.ref_name == 'main'
    
    - name: Install Railway CLI
      run: |
        npm install -g @railway/cli
    
    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        if [ "${{ github.ref_name }}" == "main" ]; then
          echo "Deploying to Production..."
          railway up --service production
        else
          echo "Deploying to Staging..."
          railway up --service staging
        fi
    
    - name: Run post-deployment checks
      run: |
        sleep 10  # Wait for deployment to stabilize
        
        if [ "${{ github.ref_name }}" == "main" ]; then
          curl -f https://camppowerup-registration.up.railway.app/health || exit 1
        else
          curl -f https://camppowerup-staging.up.railway.app/health || exit 1
        fi
    
    - name: Notify success
      if: success()
      run: |
        echo "✅ Deployment to ${{ github.ref_name == 'main' && 'Production' || 'Staging' }} successful!"
    
    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Deployment to ${{ github.ref_name == 'main' && 'Production' || 'Staging' }} failed!"
        # Add notification steps here

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure() && github.ref_name == 'main'
    
    steps:
    - name: Restore database backup
      run: |
        echo "Restoring database from backup..."
        python scripts/database/restore.py
    
    - name: Rollback Railway deployment
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        railway rollback --service production
