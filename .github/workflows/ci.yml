name: CI Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest playwright
      - name: Install browser for local-only UI tests
        run: python -m playwright install --with-deps chromium
      - name: Check whitespace and application syntax
        run: |
          git diff --check
          python -m py_compile registration_form/app.py scripts/test/run_registration_tests.py scripts/test/test_healthz.py
      - name: Run isolated registration and browser suites
        run: >-
          python scripts/test/run_registration_tests.py
          scripts/test/test_camp_league.py
          scripts/test/test_staff_camp_day.py
          scripts/test/test_discord_setup_assets.py
          scripts/test/test_admin_browser.py
          scripts/test/test_camp_day_browser.py
          scripts/test/test_discord_setup_browser.py
